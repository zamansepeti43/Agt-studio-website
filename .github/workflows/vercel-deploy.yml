name: Deploy AGT Studio to Vercel

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "VERCEL_TOKEN secret is missing. Add it in GitHub repository Settings > Secrets and variables > Actions."
            exit 1
          fi
          npx --yes vercel@latest deploy --prod --yes --token="$VERCEL_TOKEN"
